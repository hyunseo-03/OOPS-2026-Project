      .abstract { font: italic 700 20px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 16px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #475569; }
      .rel { stroke: #1f2937; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .read { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 5; marker-end: url(#arrow); }
      .inheritLine { stroke: #1f2937; stroke-width: 2.1; fill: none; marker-end: url(#inherit); }
