      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; rx: 8; }
      .view { fill: #eef2ff; }
      .controller { fill: #f0fdf4; }
      .model { fill: #ecfeff; }
      .machine { fill: #fff7ed; }
      .data { fill: #fdf2f8; }
      .note { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 8; }
