  <rect class="note" x="1930" y="125" width="520" height="230"/>
  <text class="header" x="1955" y="160">UML Legend</text>
  <text class="text" x="1955" y="195">- means private member or method</text>
  <text class="text" x="1955" y="222"># means protected member or method</text>
  <text class="text" x="1955" y="249">+ means public member or method</text>
  <text class="text" x="1955" y="276">Hollow triangle arrow means inheritance</text>
  <text class="text" x="1955" y="303">Solid arrow means has-a / uses relationship</text>
  <text class="text" x="1955" y="330">Dashed arrow means read-only dependency</text>
</svg>
