  <rect class="box machine" x="760" y="985" width="590" height="430"/>
  <text class="abstract" x="785" y="1020">Machine &lt;&lt;abstract&gt;&gt;</text>
  <line class="sep" x1="760" y1="1038" x2="1350" y2="1038"/>
  <text class="text" x="785" y="1068"># std::string name</text>
  <text class="text" x="785" y="1095"># bool running</text>
  <text class="text" x="785" y="1122"># bool paused</text>
  <text class="text" x="785" y="1149"># bool failed</text>
  <text class="text" x="785" y="1176"># bool hasCompleted</text>
  <text class="text" x="785" y="1203"># float progress</text>
  <text class="text" x="785" y="1230"># float cycleTime</text>
  <text class="text" x="785" y="1257"># float malfunctionRate</text>
  <text class="text" x="785" y="1284"># checkMalfunction(float dt) : void</text>
  <line class="sep" x1="760" y1="1302" x2="1350" y2="1302"/>
  <text class="text" x="785" y="1332">+ Machine(name, cycleTime, malfunctionRate = 0.0003f)</text>
  <text class="text" x="785" y="1359">+ configure(const MachineConfig&amp;) : void</text>
  <text class="text" x="785" y="1386">+ update(float dt) : void = 0</text>
  <text class="text" x="785" y="1413">+ start(), stop(), reset(), repair(), pause(), resume()</text>
  <text class="text" x="785" y="1440">+ isDone(), isFailed(), isRunning(), isPaused()</text>
  <text class="text" x="785" y="1467">+ getProgress(), getName()</text>

