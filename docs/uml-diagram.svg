<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M10,6 L0,0 L0,12 z" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .section { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .model { fill: #ecfeff; }
      .view { fill: #eef2ff; }
      .controller { fill: #f0fdf4; }
      .machine { fill: #fff7ed; }
      .enum { fill: #fdf2f8; }
      .header { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475569; }
      .abstract { font: italic 700 17px Arial, sans-serif; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .inheritLine { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#inherit); }
      .compose { stroke: #0f172a; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .note { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1000"/>
  <text class="title" x="50" y="55">Burger Factory Simulation UML</text>
  <text class="subtitle" x="50" y="82">C++ OOP + ImGui MVC structure</text>

  <text class="section" x="70" y="135">MVC Layer</text>

  <rect class="box view" x="60" y="155" width="270" height="150"/>
  <text class="header" x="80" y="185">FactoryView</text>
  <line x1="60" y1="197" x2="330" y2="197" stroke="#334155"/>
  <text class="small" x="80" y="222">- BurgerFactoryModel&amp; model</text>
  <text class="small" x="80" y="244">- FactoryController&amp; controller</text>
  <line x1="60" y1="258" x2="330" y2="258" stroke="#334155"/>
  <text class="small" x="80" y="282">+ render()</text>

  <rect class="box controller" x="410" y="155" width="280" height="150"/>
  <text class="header" x="430" y="185">FactoryController</text>
  <line x1="410" y1="197" x2="690" y2="197" stroke="#334155"/>
  <text class="small" x="430" y="222">- BurgerFactoryModel&amp; model</text>
  <line x1="410" y1="236" x2="690" y2="236" stroke="#334155"/>
  <text class="small" x="430" y="260">+ update(float dt)</text>
  <text class="small" x="430" y="282">+ onStartMachine(step)</text>

  <rect class="box model" x="790" y="130" width="340" height="215"/>
  <text class="header" x="810" y="160">BurgerFactoryModel</text>
  <line x1="790" y1="172" x2="1130" y2="172" stroke="#334155"/>
  <text class="small" x="810" y="197">- ProcessStep currentStep</text>
  <text class="small" x="810" y="219">- preparedIngredients</text>
  <text class="small" x="810" y="241">- qualityCheckPassed</text>
  <line x1="790" y1="255" x2="1130" y2="255" stroke="#334155"/>
  <text class="small" x="810" y="279">+ update(float dt)</text>
  <text class="small" x="810" y="301">+ startProcess(step)</text>
  <text class="small" x="810" y="323">+ addOrder(type)</text>

  <path class="line" d="M330 215 C355 215, 380 215, 410 215"/>
  <text class="tiny" x="342" y="203">button event</text>
  <path class="line" d="M690 230 C725 230, 750 230, 790 230"/>
  <text class="tiny" x="704" y="218">control model</text>
  <path class="dash" d="M790 185 C610 105, 360 105, 210 155"/>
  <text class="tiny" x="460" y="112">read state by getters</text>

  <text class="section" x="70" y="395">Model Composition</text>

  <rect class="box model" x="60" y="420" width="250" height="135"/>
  <text class="header" x="80" y="450">InventoryManager</text>
  <line x1="60" y1="462" x2="310" y2="462" stroke="#334155"/>
  <text class="small" x="80" y="487">- map&lt;IngredientType,int&gt;</text>
  <line x1="60" y1="501" x2="310" y2="501" stroke="#334155"/>
  <text class="small" x="80" y="525">+ hasEnough()</text>
  <text class="small" x="80" y="547">+ use(), refill()</text>

  <rect class="box model" x="350" y="420" width="220" height="135"/>
  <text class="header" x="370" y="450">MoneyManager</text>
  <line x1="350" y1="462" x2="570" y2="462" stroke="#334155"/>
  <text class="small" x="370" y="487">- int money</text>
  <line x1="350" y1="501" x2="570" y2="501" stroke="#334155"/>
  <text class="small" x="370" y="525">+ add()</text>
  <text class="small" x="370" y="547">+ spend(), getMoney()</text>

  <rect class="box model" x="610" y="420" width="270" height="155"/>
  <text class="header" x="630" y="450">OrderManager</text>
  <line x1="610" y1="462" x2="880" y2="462" stroke="#334155"/>
  <text class="small" x="630" y="487">- Order currentOrder</text>
  <text class="small" x="630" y="509">- vector&lt;Order&gt; orderQueue</text>
  <text class="small" x="630" y="531">- completedOrders</text>
  <line x1="610" y1="545" x2="880" y2="545" stroke="#334155"/>
  <text class="small" x="630" y="568">+ addOrder(), completeOrder()</text>

  <rect class="box model" x="930" y="420" width="300" height="155"/>
  <text class="header" x="950" y="450">ProductionLine</text>
  <line x1="930" y1="462" x2="1230" y2="462" stroke="#334155"/>
  <text class="small" x="950" y="487">- vector&lt;unique_ptr&lt;Machine&gt;&gt;</text>
  <line x1="930" y1="501" x2="1230" y2="501" stroke="#334155"/>
  <text class="small" x="950" y="525">+ update(float dt)</text>
  <text class="small" x="950" y="547">+ startMachine(step)</text>
  <text class="small" x="950" y="569">+ resetMachine(step)</text>

  <path class="compose" d="M890 345 L250 420"/>
  <path class="compose" d="M935 345 L480 420"/>
  <path class="compose" d="M985 345 L745 420"/>
  <path class="compose" d="M1030 345 L1080 420"/>
  <text class="tiny" x="780" y="382">has-a composition</text>

  <rect class="box model" x="650" y="615" width="190" height="95"/>
  <text class="header" x="670" y="645">Order</text>
  <line x1="650" y1="657" x2="840" y2="657" stroke="#334155"/>
  <text class="small" x="670" y="682">+ BurgerType type</text>
  <text class="small" x="670" y="704">+ bool isCompleted</text>
  <path class="compose" d="M745 575 L745 615"/>

  <text class="section" x="70" y="755">Machine Inheritance</text>

  <rect class="box machine" x="550" y="735" width="310" height="175"/>
  <text class="abstract" x="570" y="765">Machine &lt;&lt;abstract&gt;&gt;</text>
  <line x1="550" y1="777" x2="860" y2="777" stroke="#334155"/>
  <text class="small" x="570" y="802"># name, running, paused</text>
  <text class="small" x="570" y="824"># progress, cycleTime</text>
  <line x1="550" y1="838" x2="860" y2="838" stroke="#334155"/>
  <text class="small" x="570" y="862">+ start(), stop(), reset()</text>
  <text class="small" x="570" y="884">+ update(float dt)*</text>

  <rect class="box machine" x="60" y="820" width="180" height="70"/>
  <text class="header" x="80" y="850">PrepMachine</text>
  <text class="small" x="80" y="875">+ update()</text>

  <rect class="box machine" x="270" y="820" width="210" height="90"/>
  <text class="header" x="290" y="850">GrillMachine</text>
  <text class="small" x="290" y="875">- pattyCount</text>
  <text class="small" x="290" y="897">+ configure(), update()</text>

  <rect class="box machine" x="900" y="820" width="190" height="80"/>
  <text class="header" x="920" y="850">SauceMachine</text>
  <text class="small" x="920" y="875">- sauceApplied</text>

  <rect class="box machine" x="1120" y="790" width="220" height="80"/>
  <text class="header" x="1140" y="820">AssemblyMachine</text>
  <text class="small" x="1140" y="845">- assembled</text>

  <rect class="box machine" x="1120" y="890" width="190" height="70"/>
  <text class="header" x="1140" y="920">QualityChecker</text>
  <text class="small" x="1140" y="945">+ update()</text>

  <rect class="box machine" x="1330" y="820" width="150" height="100"/>
  <text class="header" x="1348" y="850">Packing</text>
  <text class="header" x="1348" y="870">Machine</text>
  <text class="small" x="1348" y="895">- sealed</text>
  <text class="small" x="1348" y="917">+ configure()</text>

  <path class="inheritLine" d="M240 855 C340 770, 430 760, 550 785"/>
  <path class="inheritLine" d="M480 865 C515 840, 535 820, 550 810"/>
  <path class="inheritLine" d="M900 860 C875 840, 865 820, 860 810"/>
  <path class="inheritLine" d="M1120 830 C1020 760, 940 755, 860 785"/>
  <path class="inheritLine" d="M1120 925 C1015 900, 935 875, 860 855"/>
  <path class="inheritLine" d="M1330 870 C1160 790, 1010 770, 860 795"/>

  <path class="compose" d="M1080 575 C1080 660, 940 725, 860 760"/>
  <text class="tiny" x="1110" y="650">owns machines</text>

  <rect class="note" x="1190" y="130" width="250" height="115"/>
  <text class="header" x="1210" y="160">Key Rules</text>
  <text class="small" x="1210" y="187">Model has no ImGui code</text>
  <text class="small" x="1210" y="211">View only calls Controller</text>
  <text class="small" x="1210" y="235">Machines use inheritance</text>
</svg>
