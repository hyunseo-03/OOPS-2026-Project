<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150">
  <defs>
    <marker id="inherit" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M11,6.5 L1,1 L1,12 z" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2.2; rx: 8; }
      .parent { fill: #fff7ed; }
      .child { fill: #fffbeb; }
      .config { fill: #ecfeff; }
      .enum { fill: #fdf2f8; }
      .header { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .abstract { font: italic 700 19px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 15px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#inherit); }
      .assoc { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#inherit); }
      .note { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.8; rx: 8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1150"/>
  <text class="title" x="60" y="60">Machine Class Hierarchy - Detailed UML</text>
  <text class="subtitle" x="60" y="88">Based on current header files: Machine, PrepMachine, GrillMachine, SauceMachine, AssemblyMachine, QualityChecker, PackingMachine</text>

  <rect class="box parent" x="575" y="130" width="550" height="435"/>
  <text class="abstract" x="600" y="164">Machine &lt;&lt;abstract&gt;&gt;</text>
  <line x1="575" y1="182" x2="1125" y2="182" stroke="#1f2937" stroke-width="1.5"/>
  <text class="text" x="600" y="212"># std::string name</text>
  <text class="text" x="600" y="237"># bool running</text>
  <text class="text" x="600" y="262"># bool paused</text>
  <text class="text" x="600" y="287"># bool failed</text>
  <text class="text" x="600" y="312"># bool hasCompleted</text>
  <text class="text" x="600" y="337"># float progress</text>
  <text class="text" x="600" y="362"># float cycleTime</text>
  <text class="text" x="600" y="387"># float malfunctionRate</text>
  <text class="text" x="600" y="412"># checkMalfunction(float dt) : void</text>
  <line x1="575" y1="430" x2="1125" y2="430" stroke="#1f2937" stroke-width="1.5"/>
  <text class="text" x="600" y="460">+ Machine(name, cycleTime, malfunctionRate = 0.0003f)</text>
  <text class="text" x="600" y="485">+ virtual ~Machine()</text>
  <text class="text" x="600" y="510">+ configure(const MachineConfig&amp; config) : void</text>
  <text class="text" x="600" y="535">+ update(float dt) : void = 0</text>
  <text class="text" x="600" y="560">+ start(), stop(), reset(), repair(), pause(), resume()</text>
  <text class="text" x="600" y="585">+ isDone(), isFailed(), isRunning(), isPaused() : bool</text>
  <text class="text" x="600" y="610">+ getProgress() : float</text>
  <text class="text" x="600" y="635">+ getName() : const std::string&amp;</text>

  <rect class="box child" x="60" y="710" width="250" height="150"/>
  <text class="header" x="85" y="745">PrepMachine</text>
  <line x1="60" y1="763" x2="310" y2="763" stroke="#1f2937" stroke-width="1.4"/>
  <text class="small" x="85" y="793">(no extra member variables)</text>
  <line x1="60" y1="815" x2="310" y2="815" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="85" y="845">+ PrepMachine()</text>
  <text class="text" x="85" y="872">+ update(float dt) override</text>

  <rect class="box child" x="350" y="675" width="330" height="245"/>
  <text class="header" x="375" y="710">GrillMachine</text>
  <line x1="350" y1="728" x2="680" y2="728" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="375" y="758">- int pattyCount</text>
  <text class="text" x="375" y="783">- int pattiesGrilled</text>
  <text class="text" x="375" y="808">- static constexpr float BASE_CYCLE = 3.0f</text>
  <line x1="350" y1="828" x2="680" y2="828" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="375" y="858">+ GrillMachine()</text>
  <text class="text" x="375" y="883">+ configure(const MachineConfig&amp;) override</text>
  <text class="text" x="375" y="908">+ update(float dt) override</text>
  <text class="text" x="375" y="933">+ getPattyCount() : int</text>
  <text class="text" x="375" y="958">+ getPattiesGrilled() : int</text>

  <rect class="box child" x="725" y="710" width="285" height="175"/>
  <text class="header" x="750" y="745">SauceMachine</text>
  <line x1="725" y1="763" x2="1010" y2="763" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="750" y="793">- bool sauceApplied</text>
  <line x1="725" y1="815" x2="1010" y2="815" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="750" y="845">+ SauceMachine()</text>
  <text class="text" x="750" y="870">+ update(float dt) override</text>
  <text class="text" x="750" y="895">+ isSauceApplied() : bool</text>

  <rect class="box child" x="1050" y="710" width="300" height="175"/>
  <text class="header" x="1075" y="745">AssemblyMachine</text>
  <line x1="1050" y1="763" x2="1350" y2="763" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="1075" y="793">- bool assembled</text>
  <line x1="1050" y1="815" x2="1350" y2="815" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="1075" y="845">+ AssemblyMachine()</text>
  <text class="text" x="1075" y="870">+ update(float dt) override</text>
  <text class="text" x="1075" y="895">+ isAssembled() : bool</text>

  <rect class="box child" x="1390" y="710" width="250" height="150"/>
  <text class="header" x="1415" y="745">QualityChecker</text>
  <line x1="1390" y1="763" x2="1640" y2="763" stroke="#1f2937" stroke-width="1.4"/>
  <text class="small" x="1415" y="793">(no extra member variables)</text>
  <line x1="1390" y1="815" x2="1640" y2="815" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="1415" y="845">+ QualityChecker()</text>
  <text class="text" x="1415" y="872">+ update(float dt) override</text>

  <rect class="box child" x="1135" y="940" width="365" height="190"/>
  <text class="header" x="1160" y="975">PackingMachine</text>
  <line x1="1135" y1="993" x2="1500" y2="993" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="1160" y="1023">- std::string burgerLabel</text>
  <text class="text" x="1160" y="1048">- bool sealed</text>
  <line x1="1135" y1="1068" x2="1500" y2="1068" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="1160" y="1098">+ PackingMachine()</text>
  <text class="text" x="1160" y="1123">+ configure(const MachineConfig&amp;) override</text>

  <rect class="box config" x="1210" y="160" width="330" height="130"/>
  <text class="header" x="1235" y="195">MachineConfig</text>
  <line x1="1210" y1="213" x2="1540" y2="213" stroke="#1f2937" stroke-width="1.4"/>
  <text class="text" x="1235" y="243">+ int pattyCount = 1</text>
  <text class="text" x="1235" y="268">+ BurgerType burgerType = CLASSIC</text>

  <rect class="note" x="1210" y="330" width="330" height="155"/>
  <text class="header" x="1235" y="365">Meaning</text>
  <text class="text" x="1235" y="395">GrillMachine reads pattyCount.</text>
  <text class="text" x="1235" y="422">PackingMachine reads burgerType.</text>
  <text class="text" x="1235" y="449">Other machines ignore config.</text>

  <path class="line" d="M185 710 C250 610, 410 525, 575 520"/>
  <path class="line" d="M515 675 C555 610, 620 575, 690 565"/>
  <path class="line" d="M867 710 C865 640, 860 600, 855 565"/>
  <path class="line" d="M1200 710 C1135 630, 1065 585, 990 565"/>
  <path class="line" d="M1515 710 C1395 610, 1245 560, 1125 540"/>
  <path class="line" d="M1317 940 C1225 790, 1115 650, 1025 565"/>

  <path class="assoc" d="M1210 225 C1165 225, 1160 300, 1125 330"/>
  <text class="small" x="1145" y="222">uses in configure()</text>
</svg>
